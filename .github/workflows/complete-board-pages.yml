name: Complete Board Pages branch
on:
  push:
    branches: [codex/board-pages]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/board-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply integration patch
        run: python tools/apply-board-pages.py
      - name: Verify
        run: |
          npm run check
          npm test
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js ai-board.js sw.js
          git diff --cached --check
          git commit -m "Integrate Board Pages into AirBoard"
          git push origin HEAD:codex/board-pages
