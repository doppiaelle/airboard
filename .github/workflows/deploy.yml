name: Deploy AirBoard to GitHub Pages
run-name: >-
  ${{ github.ref_name == 'main'
    && 'Deploy production to GitHub Pages'
    || format('Deploy {0} preview to GitHub Pages', github.ref_name) }}
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      # The default Pages environment normally accepts only main. A separate,
      # unprotected environment lets an explicitly selected branch deploy for
      # manual testing without weakening the production rule.
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
