name: Final PR5 redo hotfix
on:
  push:
    branches: [codex/board-pages]
    paths: [.github/workflows/hotfix-pr5-redo.yml]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/board-pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ai-board.js'); s=p.read_text();
          bad='''  function pushHistory(snapshot) {\n    pushHistory(snapshot);\n    redoHistory = [];\n  }'''
          good='''  function pushHistory(snapshot) {\n    history.push(snapshot);\n    redoHistory = [];\n  }'''
          assert bad in s
          p.write_text(s.replace(bad, good, 1))
          p=Path('tests/board-pages-cache.test.js'); s=p.read_text(); assert '/airboard-v29/' in s; p.write_text(s.replace('/airboard-v29/','/airboard-v30/'))
          PY
          npm run check
          npm test
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ai-board.js tests/board-pages-cache.test.js
          git commit -m "Fix redo history and cache validation"
          git push origin HEAD:codex/board-pages
