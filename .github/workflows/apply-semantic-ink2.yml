name: Apply Semantic Ink 2
on:
  push:
    branches: [codex/semantic-ink-2]
    paths: [.github/workflows/apply-semantic-ink2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-ink-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: python tools/apply-semantic-ink2.py
      - name: Validate
        run: |
          npm run check
          npm test
      - name: Commit implementation
        run: |
          rm tools/apply-semantic-ink2.py .github/workflows/apply-semantic-ink2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add editable Semantic Ink objects and basic shapes"
          git push origin HEAD:codex/semantic-ink-2
