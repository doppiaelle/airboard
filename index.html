<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/><meta name="theme-color" content="#08090c"/><link rel="manifest" href="./manifest.webmanifest"/><link rel="stylesheet" href="./styles.css"/><title>AirBoard</title></head>
<body><main id="stage"><video id="camera" playsinline muted></video><canvas id="ink"></canvas><canvas id="hud"></canvas>
<div id="welcome" class="panel"><div class="panel-head"><div class="brand-mark"><span></span><span></span></div><button id="language" class="lang-switch" aria-label="Change language"><span class="lang-en active">EN</span><span class="lang-it">IT</span></button></div><div class="eyebrow">AIRBOARD</div><h1 data-i18n="heroTitle">Write in the air.</h1><p data-i18n-html="heroText">Use <b>Free</b> mode for gesture-controlled tools, or lock a tool to stay focused on your lesson.</p><button id="start" class="start-btn"><span data-i18n="start">Start AirBoard</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><small data-i18n="privacy">Your camera is processed directly on your device.</small></div>
<div class="topbar"><div class="brand"><div class="brand-mark small"><span></span><span></span></div><span>AirBoard</span></div><div class="top-actions"><button id="languageTop" class="lang-switch compact" aria-label="Change language"><span class="lang-en active">EN</span><span class="lang-it">IT</span></button><div class="live-state"><i></i><span id="status">Ready</span></div></div></div>
<div id="gestureHint" class="gesture-hint">Pointer · gestures locked</div>
<div class="utility-switch glass"><button id="undo" class="icon-btn" title="Undo" aria-label="Undo" data-i18n-title="undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg></button><button id="clear" class="icon-btn" title="Clear board" aria-label="Clear board" data-i18n-title="clear"><svg viewBox="0 0 24 24"><path d="m4 16 9-9 5 5-7 7H7l-3-3ZM11 19h9"/></svg></button><span class="divider"></span><button id="mirror" class="icon-btn" title="Mirror camera" aria-label="Mirror camera" data-i18n-title="mirror"><svg viewBox="0 0 24 24"><path d="M8 7 4 11l4 4M4 11h7M16 17l4-4-4-4M20 13h-7"/></svg></button><button id="download" class="icon-btn" title="Export PNG" aria-label="Export PNG" data-i18n-title="export"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></button><span class="divider desktop-only"></span><label class="stroke-control"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M8 19h11"/></svg><input id="width" type="range" min="2" max="16" value="6" aria-label="Pen thickness"/></label></div>
<div class="tool-dock glass" role="group" aria-label="AirBoard tools"><button class="mode-btn" data-mode="free"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="free">Free</span></button><button class="mode-btn active" data-mode="pointer"><svg viewBox="0 0 24 24"><path d="m6 3 12 9-6 2-3 6L6 3Z"/></svg><span data-i18n="pointer">Pointer</span></button><button class="mode-btn" data-mode="pen"><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10L4 20ZM13.5 7l3.5 3.5"/></svg><span data-i18n="pen">Pen</span></button><button class="mode-btn" data-mode="eraser"><svg viewBox="0 0 24 24"><path d="m5 15 8-9 6 6-7 8H8l-3-5ZM11 20h9"/></svg><span data-i18n="eraser">Eraser</span></button></div>
</main><script type="module" src="./app.js"></script></body></html>
